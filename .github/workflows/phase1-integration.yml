name: Phase 1 disposable integration
on:
  pull_request:
    branches: [aurral-classical]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: Collinlong1/aurral
          ref: aecbb96625340cb3a1bd469787211cfe9bedcab5
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
      - run: npm ci --ignore-scripts && npm test && npm run build && node dev/generate-fixtures.mjs
        working-directory: plugin
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile && pnpm check && pnpm build
        working-directory: core
      - name: Start disposable Compose and test real-user playback
        working-directory: plugin
        env:
          AURRAL_CORE_PATH: ${{ github.workspace }}/core
        run: |
          docker compose -f compose.dev.yaml up -d
          for attempt in $(seq 1 60); do
            if docker compose -f compose.dev.yaml exec -T aurral node -e 'fetch("http://127.0.0.1:3001/api/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker compose -f compose.dev.yaml exec -T aurral node /plugin/dev/smoke.mjs
          docker compose -f compose.dev.yaml restart aurral
          for attempt in $(seq 1 60); do
            if docker compose -f compose.dev.yaml exec -T aurral node -e 'fetch("http://127.0.0.1:3001/api/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker compose -f compose.dev.yaml exec -T aurral node /plugin/dev/smoke.mjs
      - name: Capture logs and stop disposable services
        if: always()
        working-directory: plugin
        env:
          AURRAL_CORE_PATH: ${{ github.workspace }}/core
        run: |
          docker compose -f compose.dev.yaml logs
          docker compose -f compose.dev.yaml down
